<head>

  <title>每日打卡 · 高考冲刺清单</title>
  <meta name="description" content="每日任务清单，追踪高考冲刺进度。打卡、统计、坚持，一步步逼近目标。" />
  <link rel="stylesheet" href="style.css" />
  <script>
    (function(){
      try {
        var t = localStorage.getItem('xh-theme');
        if (!t) t = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
        if (t === 'dark') document.documentElement.classList.add('dark');
      } catch(e){}
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="nav-inner">
      <a class="brand" href="index.html">
        <img src="b97cd1ee-709c-4553-b53d-cadbb6773c26.png" alt="Logo" class="brand-logo">
        <span class="brand-dot"></span>
        <span class="brand-sub mono">核心考点 · 智能提分</span>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html">首页</a>
        <a href="methods.html">教学方法</a>
        <a href="calculator.html">努力价值计算</a>
        <a href="checklist.html" class="active">每日打卡</a>
        <a href="changelog.html">更新日志</a>
        <a href="https://github.com/kuangketongxue/gaokao-learn" target="_blank" rel="noopener">GitHub 开源</a>
      </nav>
      <span class="nav-spacer"></span>
      <a class="btn-search" href="search.html" title="搜索知识点">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>
        </svg>
        <span>搜索解读…</span>
      </a>
      <a class="icon-link" href="https://www.xiaohongshu.com/user/profile/61ef879f000000001000d2ce" target="_blank" rel="noopener" title="小红书">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/>
          <circle cx="5" cy="19" r="1.6" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <button class="btn-theme" id="btnTheme" data-theme-toggle title="切换主题">
        <span class="ico">☀️</span>
      </button>
      <button class="nav-toggle" id="navToggle" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- App Content -->
  <div id="app-content">
    <main>
      <div class="ck-wrap">

        <!-- Top Bar: countdown tiles + progress -->
        <div class="ck-top">
          <div class="cd">
            <div class="n" id="cdGaokao">--</div>
            <div class="l">距高考</div>
          </div>
          <div class="cd">
            <div class="n" id="cdDeadline">--</div>
            <div class="l">距 12.31</div>
          </div>
          <div class="cd">
            <div class="n" id="cdStreak">--</div>
            <div class="l">已坚持</div>
          </div>
          <div class="cd">
            <div class="n" id="cdElapsed">--</div>
            <div class="l">已过天数</div>
          </div>
          <div class="spacer"></div>
          <div class="prog">
            <div class="pct" id="progressPct">0%</div>
            <div class="pl" id="progCount">0/0</div>
          </div>
        </div>

        <!-- Now Banner -->
        <div class="ck-now" id="nowBanner">
          <div class="now-label">NOW</div>
          <div class="now-text" id="nowText">--</div>
          <div class="now-hint" id="nowHint">--</div>
        </div>

        <!-- Tab Bar -->
        <div class="ck-tabs" id="ckTabs">
          <button class="ck-tab on" data-tab="daily">每日</button>
          <button class="ck-tab" data-tab="weekly">每周</button>
          <button class="ck-tab" data-tab="monthly">每月</button>
          <button class="ck-tab" data-tab="longterm">长期</button>
          <button class="ck-tab" data-tab="targets">目标</button>
        </div>

        <!-- Panel: 每日 -->
        <div class="ck-panel on" id="panel-daily"></div>

        <!-- Panel: 每周 -->
        <div class="ck-panel" id="panel-weekly"></div>

        <!-- Panel: 每月 -->
        <div class="ck-panel" id="panel-monthly"></div>

        <!-- Panel: 长期 -->
        <div class="ck-panel" id="panel-longterm"></div>

        <!-- Panel: 目标 -->
        <div class="ck-panel" id="panel-targets"></div>

      </div>
    </main>
  </div>

  <footer class="site-footer">
    <div class="footer-cols">
      <div class="footer-brand">
        <div class="mark">
          <img src="b97cd1ee-709c-4553-b53d-cadbb6773c26.png" alt="Logo" class="brand-logo"><span class="brand-dot"></span>
          <span class="brand-sub mono">核心考点 · 智能提分</span>
        </div>
        <p>高考知识点底层逻辑拆解 + 独特提分技巧，帮你看懂、记住、用对。</p>
      </div>
      <div class="footer-col">
        <div class="h">导航</div>
        <div class="links">
          <a href="index.html">首页</a>
          <a href="methods.html">教学方法</a>
          <a href="calculator.html">努力价值计算</a>
          <a href="checklist.html">每日打卡</a>
          <a href="changelog.html">更新日志</a>
        </div>
      </div>
      <div class="footer-col">
        <div class="h">社区</div>
        <div class="links">
          <a href="https://www.xiaohongshu.com/user/profile/61ef879f000000001000d2ce" target="_blank" rel="noopener">小红书</a>
          <a href="https://github.com/kuangketongxue/gaokao-learn" target="_blank" rel="noopener">GitHub</a>
        </div>
      </div>
      <div class="footer-col">
        <div class="h">关注</div>
        <p style="font-size:13px;color:var(--ink-2);margin-bottom:10px;">
          最新视频与提分技巧优先在小红书更新。
        </p>
        <a class="wall-btn primary" href="https://www.xiaohongshu.com/user/profile/61ef879f000000001000d2ce" target="_blank" rel="noopener">关注小红书</a>
      </div>
    </div>
    <div class="footer-bar">
      <div class="inner">
        <div>&copy; <span id="year"></span> 高考知识点精讲 · 用逻辑代替题海</div>
        <div>Made with AI · 底层逻辑拆解</div>
      </div>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="main.js"></script>
  <script src="checklist.js"></script>
</body>
</html>
